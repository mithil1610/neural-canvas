workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: "Neural Canvas"
    environment:
      flutter: stable
      groups:
        - apple_credentials # Make sure your environment variables are linked here
    scripts:
      - name: Flutter pub get (Post-clone)
        script: |
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --archive-method=app-store
      - name: Build Flutter iOS IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true